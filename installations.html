<div class="inst-wrap"><article class="prose" id="inst"><p>Loading…</p></article></div>

<script src="site.js?v=6"></script>
<script>
(async () => {
  const { esc } = Gaug;
  const el = document.getElementById("inst");
  const hint = location.protocol === "file:"
    ? `<p>Browsers block <code>fetch()</code> on <code>file://</code>. Serve the folder, e.g. <code>python -m http.server</code>, then open <code>http://localhost:8000/installations.html</code>.</p>` : "";
  let data;
  try {
    const r = await fetch("versions.json", { cache: "no-cache" });
    if (!r.ok) throw new Error("versions.json: HTTP " + r.status);
    const parse = Gaug.lenient || (t => JSON.parse(t.replace(/("(?:[^"\\]|\\.)*")|,(\s*[}\]])/g, (m, str, close) => str || close)));
    data = parse(await r.text());
  } catch (e) {
    el.innerHTML = `<h1>Installations</h1><div class="callout danger"><p class="ct">Could not load versions.json</p><p>${esc(e.message)}</p>${hint}</div>`;
    return;
  }
  const vs = data.versions || [];
  const latest = vs.find(v => v.latest) || vs[0];
  const fmtDate = d => { const t = new Date(d + "T00:00:00"); return isNaN(t) ? String(d) : t.toLocaleDateString(undefined, { year: "numeric", month: "short", day: "numeric" }); };
  const isExt = u => /^https?:/.test(u);
  const base = p => p.split("?")[0].split("/").pop();

  const row = f => {
    const href = f.file || f.url || "#";
    const size = f.size ? ` &middot; ${esc(f.size)}` : ` <span class="dl-size" data-f="${esc(href)}"></span>`;
    return `<div class="dl-row"><div class="dl-info"><b>${esc(f.name || base(href))}</b><small>${esc(base(href))}${size}</small>` +
      (f.sha256 ? `<small>SHA-256 ${esc(f.sha256)}</small>` : "") +
      `</div><a class="dl" href="${esc(href)}"${isExt(href) ? ' target="_blank" rel="noopener"' : " download"}>Download</a></div>`;
  };
  const section = v => {
    const id = "v" + String(v.version).toLowerCase().replace(/[^\w]+/g, "-");
    const tags = (v === latest ? '<span class="tag">Latest</span>' : "") + (v.tag ? `<span class="tag alt">${esc(v.tag)}</span>` : "");
    const notes = v.notes ? Gaug.md(Array.isArray(v.notes) ? v.notes.join("\n") : String(v.notes), h => h) : "";
    const files = (v.files || []).map(row).join("");
    return `<section id="${id}"><h2>Gaug ${esc(v.version)}${tags}</h2>` +
      (v.date ? `<p class="ver-meta">${esc(fmtDate(v.date))}</p>` : "") + notes +
      (files ? `<div class="dl-list">${files}</div>` : `<p class="ver-meta">No files for this version yet.</p>`) + `</section>`;
  };

  el.innerHTML = `<h1>Installations</h1><p>${esc(data.intro || "Download any version of Gaug.")}</p>` +
    (vs.length ? vs.map(section).join("") : `<p>No versions listed yet. Add them to <code>versions.json</code>.</p>`);

  // show file sizes for entries that don't list one
  el.querySelectorAll(".dl-size").forEach(async s => {
    try {
      const r = await fetch(s.dataset.f, { method: "HEAD", cache: "no-cache" });
      const n = r.ok ? +r.headers.get("content-length") : 0;
      if (n) s.textContent = "· " + (n >= 1048576 ? (n / 1048576).toFixed(1) + " MB" : Math.max(1, Math.round(n / 1024)) + " KB");
    } catch (e) {}
  });
  if (location.hash.length > 1) { const t = document.getElementById(decodeURIComponent(location.hash.slice(1))); if (t) t.scrollIntoView(); }
})();
</script>
</body>
</html>
